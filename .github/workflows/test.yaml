# This workflow runs all the tests in ubuntu, windows and mac
# environments.
#
# Trigger this workflow by pushing commits or by opening 
# a pull request.
name: Test
on: 
  push:
  pull_request:
    types:
      - opened
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Test the matrix-selected toolchain instead of switching to the
      # preferred toolchain from go.mod.
      GOTOOLCHAIN: local
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable, oldstable]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install matrix Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Run tests
        run: go test -v ./...
